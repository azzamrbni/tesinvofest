<html>
  <head>
    <title>Impossible Gallery Prototype</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
    <script>
      AFRAME.registerComponent('link-on-click', {
        schema: {
          url: {type: 'string', default: ''}
        },
        init: function() {
          this.el.addEventListener('click', () => {
            if (this.data.url) {
              window.open(this.data.url, '_blank');
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="art-1" src="https://picsum.photos/seed/art1/1000/1000" />
        <img id="art-2" src="https://picsum.photos/seed/art2/1000/1000" />

        <a-asset-item id="avatar-model" src=""></a-asset-item>
      </a-assets>

      <a-sky id="sky-env" color="#101020"></a-sky>

      <a-plane
        id="ground"
        position="0 0 -4"
        rotation="-90 0 0"
        width="50"
        height="50"
        color="#303040"
        shadow
      >
      </a-plane>

      <a-image
        id="artwork-1"
        src="#art-1"
        width="3"
        height="3"
        position="-5 2.5 -8"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear;"
        event-set__enter="_event: mouseenter; target: #sky-env; material.color: #4B0082"
        event-set__leave="_event: mouseleave; target: #sky-env; material.color: #101020"
        class="clickable"
        link-on-click="url: https://www.google.com"
      >
      </a-image>

      <a-image
        id="artwork-2"
        src="#art-2"
        width="3"
        height="3"
        position="5 2.5 -8"
        animation="property: rotation; to: 0 -360 0; loop: true; dur: 20000; easing: linear;"
        event-set__enter="_event: mouseenter; target: #sky-env; material.color: #004D40"
        event-set__leave="_event: mouseleave; target: #sky-env; material.color: #101020"
        class="clickable"
        link-on-click="url: https://www.youtube.com"
      >
      </a-image>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera>
          <a-cursor
            fuse="true"
            fuse-timeout="1000"
            color="#FFFFFF"
            raycaster="objects: .clickable"
          >
          </a-cursor>

          <a-text
            id="onboarding-text"
            value="Tatap karya seni untuk mengubah dunia"
            position="0 -0.5 -1.5"
            align="center"
            color="#FFF"
            width="1.5"
          >
          </a-text>
        </a-camera>

        <a-entity
          teleport-controls="cameraRig: #camera-rig; ground: #ground; startEvents: teleportstart; endEvents: teleportend"
        >
        </a-entity>
      </a-entity>

      <a-sphere
        id="guide-avatar"
        position="2 1.5 -3"
        radius="0.2"
        color="#00FFFF"
        material="shader: flat"
        light="type: point; intensity: 2; color: #00FFFF"
      >
      </a-sphere>
    </a-scene>
  </body>
</html>
